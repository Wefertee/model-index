<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Model Index: сравнение моделей ИИ</title>
<meta name="description" content="Сравнение моделей ИИ по бенчмаркам, цене и скорости.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+HK:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23141414'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='17' fill='%23fff' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<style>:root{
  --bg:#fff; --fg:#141414; --muted:#6b6b6b; --faint:#9a9a9a;
  --line:#e4e4e4; --line-2:#f0f0f0; --accent:#1a53d6; --sel:#f3f6ff;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.55 "Noto Serif HK",Georgia,"Times New Roman",serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.wrap{max-width:940px;margin:0 auto;padding:0 20px}

/* шапка */
.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:24px;height:52px}
.brand{font-weight:600;font-size:15px}
.top nav{display:flex;gap:18px;margin-left:auto}
.top nav a{font-size:13px;color:var(--muted);padding:4px 0;border-bottom:1px solid transparent}
.top nav a:hover{color:var(--fg)}
.top nav a.on{color:var(--fg);border-bottom-color:var(--fg)}

/* текст */
h1{font-size:20px;font-weight:600;margin:26px 0 4px}
h2{font-size:15px;font-weight:600;margin:0}
.sub{color:var(--muted);margin:0 0 20px}
.note{color:var(--faint);font-size:12px;margin:10px 0 0}

/* таблица */
.tw{overflow-x:auto;margin:0 -2px}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:middle}
th{font-weight:500;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--fg)}
th.on{color:var(--fg)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mname{font-weight:500;white-space:nowrap}
.vendor{display:block;color:var(--faint);font-size:12px}
.rel{color:#bdbdbd}
.lead{color:var(--accent);font-weight:600}
.est{color:var(--faint);font-weight:400}
th .arw{color:var(--faint);margin-left:3px}

/* состав */
.selbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1 1 240px;min-height:30px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;
  padding:4px 7px;font-size:13px;cursor:grab;user-select:none}
.chip:active{cursor:grabbing}
.chip:hover{border-color:#c4c4c4}
.chip.dragging,.pick.dragging{opacity:.35}
.chip .x{color:var(--faint);font-size:14px;line-height:1;padding:0 1px}
.chip .x:hover{color:var(--fg)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.btn{border:1px solid var(--line);padding:5px 10px;font-size:13px;color:var(--muted)}
.btn:hover{border-color:#c4c4c4;color:var(--fg)}
.btn.on{border-color:var(--accent);color:var(--accent)}

/* выбор моделей */
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;padding:12px 0 4px}
.pick{border:1px solid var(--line-2);padding:7px 9px;text-align:left;display:flex;gap:8px;align-items:flex-start;
  font-size:13px;background:#fff;cursor:pointer;user-select:none}
.pick:hover{border-color:#c4c4c4}
.pick.on{border-color:var(--accent);background:var(--sel)}
.pick[aria-disabled="true"]{opacity:.4;cursor:default}
.pick .nm{display:block}
.pick .mt{display:block;color:var(--faint);font-size:12px;margin-top:1px}
.picker-box.drop-remove{outline:1px dashed var(--accent);outline-offset:4px}
.chips.drop-here{outline:1px dashed var(--accent);outline-offset:4px}

/* вкладки и пресеты */
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-top:14px;flex-wrap:wrap}
.tab{font-size:13px;color:var(--muted);padding:7px 0;border-bottom:1px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-bottom-color:var(--fg)}
.msg{color:var(--accent);font-size:12px}

/* подвал */
.foot{border-top:1px solid var(--line);margin-top:36px;padding:14px 0 26px;color:var(--muted);font-size:13px}
.foot .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.foot .sep{color:var(--line)}
.foot a{color:var(--fg)}
.foot a:hover{text-decoration:underline}

/* форма */
.fb{border:1px solid var(--line);background:#fff;padding:0;margin:auto;width:min(460px,calc(100vw - 28px))}
.fb::backdrop{background:rgba(0,0,0,.35)}
.fb form{padding:18px 20px 16px;margin:0}
.fb .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.fb .head h2{font-size:15px}
.fb .x2{color:var(--muted);font-size:18px;line-height:1;padding:2px 4px}
.fb .x2:hover{color:var(--fg)}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.fb input,.fb textarea{width:100%;border:1px solid var(--line);padding:7px 8px;font:inherit;font-size:13px;
  background:#fff;color:var(--fg);resize:vertical}
.fb input:focus,.fb textarea:focus{outline:0;border-color:var(--accent)}
.trap{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.fb .send{border:1px solid var(--fg);background:var(--fg);color:#fff;padding:7px 14px;font-size:13px}
.fb .send:hover{background:#000}
.fb .send:disabled{opacity:.4;cursor:default}
.fb .status{font-size:12px;color:var(--muted);margin-left:10px}
.fb .status.ok{color:#256b45}
.fb .status.err{color:#a33a2c}
.fb .alt{font-size:12px;color:var(--faint);margin:12px 0 0}
.fb .alt a{color:var(--muted);text-decoration:underline}

@media (max-width:640px){
  .top-in{height:auto;padding:10px 0;flex-wrap:wrap;gap:10px}
  .top nav{margin-left:0;width:100%}
  h1{font-size:18px;margin-top:18px}
  th,td{padding:7px 8px}
}</style>
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="#/compare">Model Index</a>
    <nav id="nav"></nav>
  </div>
</header>

<main id="app"></main>

<footer class="foot">
  <div class="wrap">
    <span>Артём Косыгин Евгеньевич</span><span class="sep">·</span>
    <span>1 курс, 15 группа</span><span class="sep">·</span>
    <a href="mailto:artem.kosygin2008@gmail.com">artem.kosygin2008@gmail.com</a><span class="sep">·</span>
    <button data-act="feedback" style="color:var(--fg);text-decoration:underline">написать</button>
  </div>
</footer>

<dialog id="fb-modal" class="fb" aria-labelledby="fb-title">
  <form novalidate autocomplete="off">
    <div class="head">
      <h2 id="fb-title">Обратная связь</h2>
      <button type="button" class="x2" data-act="fb-close" aria-label="закрыть">×</button>
    </div>
    <label class="field"><span>Имя (необязательно)</span><input name="name" type="text" maxlength="80"></label>
    <label class="field"><span>E-mail</span><input name="email" type="email" maxlength="120" placeholder="you@example.com"></label>
    <label class="field"><span>Сообщение</span><textarea name="message" rows="4" maxlength="4000"></textarea></label>
    <input class="trap" name="company" type="text" tabindex="-1" aria-hidden="true">
    <div>
      <button class="send" type="submit">Отправить</button>
      <span class="status" id="fb-status" role="status" aria-live="polite"></span>
    </div>
    <p class="alt">или письмом на <a href="mailto:artem.kosygin2008@gmail.com">artem.kosygin2008@gmail.com</a></p>
  </form>
</dialog>

<script>
const MODELS = [{"id":"opus55","name":"Claude Opus 5.5","vendor":"Anthropic","variant":"max","aa":58,"cost":5.98,"speed":97,"latency":556.94,"ctx":1000000,"bench":{"tb40":{"v":66.4,"real":true},"frontier":{"v":54.4,"real":true},"cursor":{"v":57.8,"real":true},"gdpaa":{"v":1846,"real":true},"auto":{"v":40.0,"real":true},"hle":{"v":67.7,"real":true}},"released":"2026-09"},{"id":"sonnet55","name":"Claude Sonnet 5.5","vendor":"Anthropic","variant":"max","aa":56,"cost":5.46,"speed":140,"latency":380.34,"ctx":1000000,"bench":{"tb40":{"v":62.6,"real":false},"frontier":{"v":53.4,"real":false},"cursor":{"v":55.4,"real":false},"gdpaa":{"v":1763,"real":false},"auto":{"v":38.6,"real":false},"hle":{"v":65.2,"real":false}},"released":"2026-09"},{"id":"fable51","name":"Claude Fable 5.1","vendor":"Anthropic","variant":"max","aa":53,"cost":7.63,"speed":71,"latency":173.57,"ctx":1000000,"bench":{"tb40":{"v":55.8,"real":true},"frontier":{"v":50.3,"real":true},"cursor":{"v":51.8,"real":true},"gdpaa":{"v":1735,"real":true},"auto":{"v":31.4,"real":true},"hle":{"v":65.6,"real":true}},"released":"2026-05"},{"id":"haiku55","name":"Claude Haiku 5.5","vendor":"Anthropic","variant":"max","aa":43,"cost":0.21,"speed":235,"latency":313.57,"ctx":1000000,"bench":{"tb40":{"v":37.7,"real":false},"frontier":{"v":46.6,"real":false},"cursor":{"v":39.8,"real":false},"gdpaa":{"v":1224,"real":false},"auto":{"v":29.2,"real":false},"hle":{"v":48.8,"real":false}},"released":"2026-09"},{"id":"astra","name":"GPT-6 Astra","vendor":"OpenAI","variant":"max","aa":53,"cost":3.26,"speed":65,"latency":285.18,"ctx":1000000,"bench":{"tb40":{"v":57.9,"real":true},"frontier":{"v":53.3,"real":true},"cursor":{"v":51.8,"real":false},"gdpaa":{"v":1542,"real":true},"auto":{"v":41.4,"real":true},"hle":{"v":57.2,"real":true}},"released":"2026-06"},{"id":"sol61","name":"GPT-6.1 Sol","vendor":"OpenAI","variant":"max","aa":52,"cost":0.72,"speed":64,"latency":241.6,"ctx":1000000,"bench":{"tb40":{"v":54.9,"real":false},"frontier":{"v":51.3,"real":false},"cursor":{"v":50.6,"real":false},"gdpaa":{"v":1597,"real":false},"auto":{"v":35.7,"real":false},"hle":{"v":60.1,"real":false}},"released":"2026-09"},{"id":"terra56","name":"GPT-5.6 Terra","vendor":"OpenAI","variant":"max","aa":42,"cost":1.4,"speed":137,"latency":120.79,"ctx":1000000,"bench":{"tb40":{"v":35.8,"real":false},"frontier":{"v":46.1,"real":false},"cursor":{"v":38.6,"real":false},"gdpaa":{"v":1182,"real":false},"auto":{"v":28.5,"real":false},"hle":{"v":47.5,"real":false}},"released":"2026-02"},{"id":"gemini4","name":"Gemini 4 Argon","vendor":"Google","variant":"high","aa":53,"cost":1.99,"speed":null,"latency":null,"ctx":1000000,"bench":{"tb40":{"v":56.8,"real":false},"frontier":{"v":51.8,"real":false},"cursor":{"v":51.8,"real":false},"gdpaa":{"v":1638,"real":false},"auto":{"v":36.4,"real":false},"hle":{"v":61.4,"real":false}},"released":"2026-08"},{"id":"grok47","name":"Grok 4.7","vendor":"xAI","variant":"xhigh","aa":46,"cost":3.74,"speed":97,"latency":53.17,"ctx":500000,"bench":{"tb40":{"v":43.5,"real":false},"frontier":{"v":48.2,"real":false},"cursor":{"v":43.4,"real":false},"gdpaa":{"v":1348,"real":false},"auto":{"v":31.4,"real":false},"hle":{"v":52.6,"real":false}},"released":"2026-06"},{"id":"qwen38","name":"Qwen3.8 Max","vendor":"Alibaba","variant":"0902","aa":45,"cost":5.41,"speed":37,"latency":3.12,"ctx":984000,"bench":{"tb40":{"v":41.6,"real":false},"frontier":{"v":47.6,"real":false},"cursor":{"v":42.2,"real":false},"gdpaa":{"v":1306,"real":false},"auto":{"v":30.6,"real":false},"hle":{"v":51.3,"real":false}},"released":"2026-07"},{"id":"kimik3","name":"Kimi K3","vendor":"Moonshot","variant":"max","aa":44,"cost":2.0,"speed":43,"latency":3.67,"ctx":1050000,"bench":{"tb40":{"v":39.7,"real":false},"frontier":{"v":47.1,"real":false},"cursor":{"v":41.0,"real":false},"gdpaa":{"v":1265,"real":false},"auto":{"v":29.9,"real":false},"hle":{"v":50.1,"real":false}},"released":"2026-08"},{"id":"dsv41","name":"DeepSeek V4.1 Flash","vendor":"DeepSeek","variant":"max","aa":39,"cost":0.49,"speed":227,"latency":0.91,"ctx":1000000,"bench":{"tb40":{"v":30.1,"real":false},"frontier":{"v":44.5,"real":false},"cursor":{"v":35.0,"real":false},"gdpaa":{"v":1058,"real":false},"auto":{"v":26.3,"real":false},"hle":{"v":43.8,"real":false}},"released":"2026-09"},{"id":"dsv4pro","name":"DeepSeek V4 Pro","vendor":"DeepSeek","variant":"max","aa":36,"cost":0.67,"speed":93,"latency":1.7,"ctx":1000000,"bench":{"tb40":{"v":24.4,"real":false},"frontier":{"v":43.0,"real":false},"cursor":{"v":31.4,"real":false},"gdpaa":{"v":933,"real":false},"auto":{"v":24.2,"real":false},"hle":{"v":40.0,"real":false}},"released":"2026-03"}];
const BY = {}; MODELS.forEach(m => BY[m.id] = m);
const MAX = 5;
const COLOR = {Anthropic:'#a8543c', OpenAI:'#2b2b27', Google:'#335f92', xAI:'#5f646e',
  Alibaba:'#b06a17', Moonshot:'#2e3a63', DeepSeek:'#7a5aa8'};
const NAV = [{id:'compare',label:'Сравнение'},{id:'models',label:'Модели'}];

const METRICS = {
  aa:      {label:'Индекс AA', dir:1,  fmt:v=>nf(v,0)},
  hle:     {label:"Humanity's Last Exam", dir:1, fmt:v=>nf(v,1)+'%'},
  gdpaa:   {label:'GDPval-AA', dir:1,  fmt:v=>nf(v,0)},
  tb40:    {label:'Terminal-Bench 4.0', dir:1, fmt:v=>nf(v,1)+'%'},
  frontier:{label:'FrontierCode 1.1', dir:1, fmt:v=>nf(v,1)+'%'},
  cursor:  {label:'CursorBench 4.0', dir:1, fmt:v=>nf(v,1)+'%'},
  auto:    {label:'AutomationBench', dir:1, fmt:v=>nf(v,1)+'%'},
  cost:    {label:'Цена задачи', dir:-1, fmt:v=>'$'+nf(v,2)},
  speed:   {label:'Скорость, t/s', dir:1, fmt:v=>nf(v,0)},
  latency: {label:'Задержка, с', dir:-1, fmt:v=>nf(v,2)},
  ctx:     {label:'Контекст', dir:1, fmt:v=>v>=1e6 ? nf(v/1e6,1)+' M' : nf(v/1000,0)+' k'}
};
const TABS = {
  overview:{label:'Обзор', keys:['aa','hle','gdpaa','cost']},
  code:{label:'Код', keys:['tb40','frontier','cursor']},
  agents:{label:'Агенты', keys:['gdpaa','auto','tb40']},
  money:{label:'Экономика', keys:['cost','speed','latency','ctx']}
};
const ALL_KEYS = ['aa','hle','gdpaa','cost','speed','ctx'];
const PRESETS = {
  frontier:{label:'Фронтир', ids:['opus55','astra','gemini4','grok47']},
  budget:{label:'Бюджет', ids:['haiku55','sol61','dsv41','terra56']},
  cn:{label:'Китайцы', ids:['qwen38','kimik3','dsv41']}
};

const state = {view:'compare', tab:'overview', selected:['opus55','fable51','astra','kimik3','dsv41'],
  pickerOpen:false, sort:null, msg:''};

function nf(v,d){ return Number(v).toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d}); }
const MONTHS = ['янв.','фев.','мар.','апр.','май','июн.','июл.','авг.','сент.','окт.','нояб.','дек.'];
function rel(iso){
  if(!iso) return '';
  const [y,m] = iso.split('-');
  return MONTHS[Number(m)-1] + ' ' + y;
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function cell(m,k){
  if(k==='aa') return {v:m.aa, est:false};
  if(k in m.bench){ const b=m.bench[k]; return {v:b.v, est:!b.real}; }
  return m[k]==null ? null : {v:m[k], est:false};
}

/* ---------- разметка ---------- */
function chipHtml(id){
  const m = BY[id];
  return `<div class="chip" draggable="true" role="button" tabindex="0" data-id="${id}"
    title="Убрать из сравнения">${dot(m)}<span>${esc(m.name)}</span>
    <span class="x" data-act="toggle" data-id="${id}" aria-label="убрать">×</span></div>`;
}
function dot(m){ return `<i class="dot" style="background:${COLOR[m.vendor]||'#999'}"></i>`; }
function pickHtml(m){
  const on = state.selected.includes(m.id);
  const full = !on && state.selected.length >= MAX;
  return `<div class="pick${on?' on':''}" draggable="true" role="button" tabindex="0"
    data-id="${m.id}" data-act="toggle"${full?' aria-disabled="true"':''}>
    ${dot(m)}<span><span class="nm">${esc(m.name)}</span>
    <span class="mt">${esc(m.vendor)}, индекс ${m.aa}, <span class="rel">${rel(m.released)}</span></span></span></div>`;
}

function rowsTable(ids, keys, sortable){
  // порядок
  let order = ids.slice();
  if(state.sort){
    const k = state.sort.key, desc = state.sort.desc;
    order.sort((a,b)=>{
      const A = cell(BY[a],k), B = cell(BY[b],k);
      if(!A) return 1; if(!B) return -1;
      return desc ? B.v-A.v : A.v-B.v;
    });
  }
  const best = {};
  keys.forEach(k=>{
    let b = null, n = 0, same = 0;
    order.forEach(id=>{ const c = cell(BY[id],k); if(!c) return;
      n++;
      if(b===null || (METRICS[k].dir>0 ? c.v>b.v : c.v<b.v)){ b = c; same = 1; }
      else if(c.v === b.v) same++;
    });
    // подсвечиваем лидера только если он действительно выделяется
    best[k] = (b && same < n) ? b.v : null;
  });
  const head = keys.map(k=>{
    const on = state.sort && state.sort.key===k;
    const arw = on ? `<span class="arw">${state.sort.desc?'↓':'↑'}</span>` : '';
    return `<th class="num${sortable?' sortable':''}${on?' on':''}"${sortable?` data-act="sort" data-key="${k}"`:''}>${METRICS[k].label}${arw}</th>`;
  }).join('');
  const body = order.map(id=>{
    const m = BY[id];
    const cells = keys.map(k=>{
      const c = cell(m,k);
      if(!c) return `<td class="num est">нет</td>`;
      const isBest = best[k]!==null && c.v===best[k];
      return `<td class="num${isBest?' lead':''}">${c.est?'<span class="est">≈</span>':''}${METRICS[k].fmt(c.v)}</td>`;
    }).join('');
    return `<tr><td><span class="mname">${esc(m.name)}</span><span class="vendor">${esc(m.vendor)}<span class="rel">, ${rel(m.released)}</span></span></td>${cells}</tr>`;
  }).join('');
  return `<table><thead><tr><th>Модель</th>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

function viewCompare(){
  const keys = TABS[state.tab].keys;
  const tabs = Object.keys(TABS).map(k=>
    `<button class="tab${state.tab===k?' on':''}" data-act="tab" data-tab="${k}">${TABS[k].label}</button>`).join('');
  const presets = Object.keys(PRESETS).map(k=>
    `<button class="btn" data-act="preset" data-preset="${k}">${PRESETS[k].label}</button>`).join('');
  const picker = state.pickerOpen ? `<div class="picker-box" id="picker"><div class="picker">${
    MODELS.map(pickHtml).join('')}</div></div>` : '';
  return `<div class="wrap">
    <h1>Сравнение моделей</h1>
    <p class="sub">До ${MAX} моделей. Клик по карточке добавляет или убирает модель. Чипы можно перетаскивать.</p>
    <div class="selbar">
      <div class="chips" id="chipzone">${state.selected.map(chipHtml).join('')}</div>
      <button class="btn${state.pickerOpen?' on':''}" data-act="picker">${state.pickerOpen?'Свернуть':'Изменить'}</button>
    </div>
    ${picker}
    <div class="row">${presets}<span class="msg">${esc(state.msg)}</span></div>
    <div class="tabs">${tabs}</div>
    <div class="tw">${rowsTable(state.selected, keys, true)}</div>
    <p class="note">Знак ≈ стоит у расчётных оценок. Без знака значение опубликовано.</p>
  </div>`;
}

function viewModels(){
  return `<div class="wrap">
    <h1>Все модели</h1>
    <p class="sub">${MODELS.length} моделей, ${Object.keys(COLOR).length} лабораторий.</p>
    <div class="tw">${rowsTable(MODELS.map(m=>m.id).sort((a,b)=>BY[b].aa-BY[a].aa), ALL_KEYS, false)}</div>
    <p class="note">Знак ≈ стоит у расчётных оценок. Без знака значение опубликовано.</p>
  </div>`;
}

/* ---------- поведение ---------- */
function toggle(id){
  const i = state.selected.indexOf(id);
  if(i >= 0){ state.selected.splice(i,1); state.msg=''; }
  else if(state.selected.length >= MAX){ state.msg = 'Максимум ' + MAX + ' моделей'; }
  else { state.selected.push(id); state.msg=''; }
  render();
}
function applyPreset(k){
  state.selected = PRESETS[k].ids.slice();
  state.sort = null; state.msg = '';
  render();
}

let dragId=null, dragFrom=null, lastZone=null, lastX=0, suppressClick=0;

function insertIndex(x){
  const chips = Array.from(document.querySelectorAll('#chipzone .chip'));
  for(let i=0;i<chips.length;i++){
    const r = chips[i].getBoundingClientRect();
    if(x < r.left + r.width/2) return i;
  }
  return chips.length;
}
function moveChip(x){
  const box = document.getElementById('chipzone');
  if(!box) return;
  const drag = box.querySelector('.chip[data-id="'+dragId+'"]');
  if(!drag) return;
  const others = Array.from(box.querySelectorAll('.chip')).filter(c=>c!==drag);
  let idx = others.findIndex(c=>{ const r=c.getBoundingClientRect(); return x < r.left + r.width/2; });
  if(idx < 0) idx = others.length;
  box.insertBefore(drag, others[idx] || null);
}
function commitDrag(){
  if(!dragId) return false;
  if(lastZone === 'chips'){
    if(dragFrom === 'grid'){
      if(state.selected.includes(dragId)) return false;
      if(state.selected.length >= MAX){ state.msg='Максимум '+MAX+' моделей'; return false; }
      state.selected.splice(insertIndex(lastX),0,dragId);
      state.sort = null; state.msg='';
      return true;
    }
    const order = Array.from(document.querySelectorAll('#chipzone .chip')).map(c=>c.dataset.id);
    if(order.length){ state.selected = order; state.sort = null; return true; }
  } else if(lastZone === 'remove' && dragFrom === 'chips'){
    state.selected = state.selected.filter(id=>id!==dragId);
    return true;
  }
  return false;
}
function clearDrag(){
  document.querySelectorAll('.dragging').forEach(el=>el.classList.remove('dragging'));
  document.querySelectorAll('.drop-here,.drop-remove').forEach(el=>
    el.classList.remove('drop-here','drop-remove'));
  dragId = null; dragFrom = null; lastZone = null;
}

document.addEventListener('dragstart', e=>{
  const src = e.target.closest('.chip, .pick');
  if(!src || src.getAttribute('aria-disabled')==='true'){ return; }
  dragId = src.dataset.id;
  dragFrom = src.classList.contains('chip') ? 'chips' : 'grid';
  src.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragId);
});
document.addEventListener('dragover', e=>{
  if(!dragId) return;
  const zone = e.target.closest('#chipzone, .selbar');
  const box = e.target.closest('#picker');
  if(zone){
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    lastZone = 'chips'; lastX = e.clientX;
    (document.getElementById('chipzone')||zone).classList.add('drop-here');
    if(dragFrom === 'chips') moveChip(e.clientX);
  } else if(box && dragFrom === 'chips'){
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    lastZone = 'remove';
    box.classList.add('drop-remove');
  } else {
    lastZone = null;
    document.querySelectorAll('.drop-here,.drop-remove').forEach(el=>
      el.classList.remove('drop-here','drop-remove'));
  }
});
document.addEventListener('drop', e=>{
  if(!dragId) return;
  e.preventDefault();
  const ok = commitDrag();
  suppressClick = Date.now() + 400;
  clearDrag();
  if(ok) render();
});
document.addEventListener('dragend', ()=>{
  const ok = commitDrag();
  suppressClick = Date.now() + 400;
  clearDrag();
  if(ok) render();
});

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]');
  if(!t) return;
  if(Date.now() < suppressClick) return;
  const act = t.dataset.act;
  if(act === 'toggle'){ e.preventDefault(); e.stopPropagation(); toggle(t.dataset.id); }
  else if(act === 'picker'){ state.pickerOpen = !state.pickerOpen; state.msg=''; render(); }
  else if(act === 'tab'){ state.tab = t.dataset.tab; render(); }
  else if(act === 'sort'){
    const k = t.dataset.key;
    const base = METRICS[k].dir > 0;
    if(state.sort && state.sort.key === k) state.sort.desc = !state.sort.desc;
    else state.sort = {key:k, desc:base};
    render();
  }
  else if(act === 'preset'){ applyPreset(t.dataset.preset); }
  else if(act === 'feedback'){ openFeedback(); }
  else if(act === 'fb-close'){ closeFeedback(); }
});
document.addEventListener('contextmenu', e=>{
  const t = e.target.closest('.chip, .pick');
  if(!t) return;
  e.preventDefault();
  toggle(t.dataset.id);
});

/* ---------- страницы ---------- */
function navHtml(){
  return NAV.map(n=>`<a href="#/${n.id}" class="${state.view===n.id?'on':''}">${n.label}</a>`).join('');
}
function render(){
  document.getElementById('app').innerHTML = state.view === 'models' ? viewModels() : viewCompare();
  document.getElementById('nav').innerHTML = navHtml();
}
function route(){
  const v = (location.hash.replace('#/','') || 'compare');
  state.view = (v === 'models') ? 'models' : 'compare';
  render();
}

/* ---------- форма ---------- */
function fbEl(){ return document.getElementById('fb-modal'); }
function openFeedback(){
  const d = fbEl(); if(!d) return;
  const st = document.getElementById('fb-status');
  if(st){ st.textContent=''; st.className='status'; }
  if(typeof d.showModal === 'function'){ if(!d.open) d.showModal(); }
  else d.setAttribute('open','');
  const f = d.querySelector('input[name=email]');
  if(f) setTimeout(()=>f.focus(), 40);
}
function closeFeedback(){
  const d = fbEl(); if(!d) return;
  if(typeof d.close === 'function') d.close(); else d.removeAttribute('open');
}
(function feedbackForm(){
  const d = fbEl(); if(!d) return;
  const form = d.querySelector('form');
  const status = document.getElementById('fb-status');
  const send = form.querySelector('button[type=submit]');
  const EMAIL = /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i;
  const show = (cls,text)=>{ status.className='status '+cls; status.textContent=text; };
  d.addEventListener('click', e=>{ if(e.target===d) closeFeedback(); });
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(form);
    const data = {name:String(fd.get('name')||'').trim(), email:String(fd.get('email')||'').trim(),
      message:String(fd.get('message')||'').trim(), company:String(fd.get('company')||'')};
    if(!EMAIL.test(data.email)) return show('err','Нужен корректный e-mail');
    if(data.message.length < 4) return show('err','Сообщение слишком короткое');
    send.disabled = true; show('','Отправка…');
    try{
      const res = await fetch('/api/feedback', {method:'POST',
        headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
      let json = {}; try{ json = await res.json(); }catch(_){}
      if(!res.ok) throw new Error(json.error || ('ошибка ' + res.status));
      show('ok','Отправлено, №' + json.id);
      form.reset();
    }catch(err){
      show('err', location.protocol === 'file:'
        ? 'Нужен сервер: node server.js'
        : 'Не отправлено: ' + err.message);
    }finally{ send.disabled = false; }
  });
})();

window.addEventListener('hashchange', route);
route();
</script>
